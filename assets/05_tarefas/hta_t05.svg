<text x="2598.0" y="67" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#000">0. Conduzir a apresentação comercial percebendo a reação dos</text>
<text x="2598.0" y="87" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#000">clientes e decidindo como prosseguir</text>
<text x="2598.0" y="107" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f3b8f">Plano 0: 1 &gt; 2 &gt; 3 &gt; 4 &gt; 5 &gt; 6 (2 a 5 se</text>
<text x="2598.0" y="127" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f3b8f">repetem para cada bloco da proposta)</text>
<rect x="278.0" y="200" width="330" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="443.0" y="227" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">1. Preparar a reunião</text>
<text x="443.0" y="247" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3b8f">Plano 1: 1.1 &gt; 1.2 &gt; 1.3</text>
<rect x="40.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="165.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">1.1 Confirmar quem participa</text>
<text x="165.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">do lado do cliente</text>
<line x1="46.0" y1="461" x2="284.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="318.0" y="390" width="250" height="84" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="443.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">1.2 Definir a pauta e os</text>
<text x="443.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">pontos em que vai checar a</text>
<text x="443.0" y="457" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">reação (pílulas de dúvida)</text>
<line x1="324.0" y1="481" x2="562.0" y2="481" stroke="#000" stroke-width="2.5"/>
<rect x="596.0" y="390" width="250" height="84" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="721.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">1.3 Abrir a reunião e</text>
<text x="721.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">iniciar o compartilhamento</text>
<text x="721.0" y="457" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">de tela</text>
