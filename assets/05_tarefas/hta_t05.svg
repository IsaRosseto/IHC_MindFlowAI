<text x="1166.0" y="247" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3b8f">Plano 2: 2.1 &gt; 2.2</text>
<rect x="902.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1027.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">2.1 Explicar o ponto com a</text>
<text x="1027.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">tela compartilhada</text>
<line x1="908.0" y1="461" x2="1146.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="1180.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1305.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">2.2 Soltar a pílula de</text>
<text x="1305.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">dúvida ao final do bloco</text>
<line x1="1186.0" y1="461" x2="1424.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="1863.0" y="200" width="330" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="2028.0" y="227" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">3. Perceber a reação dos clientes</text>
<text x="2028.0" y="247" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3b8f">Plano 3: (3.1 + 3.2) &gt; 3.3 &gt; 3.4</text>
<rect x="1486.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1611.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">3.1 Espiar a grade reduzida</text>
<text x="1611.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">de vídeo</text>
<line x1="1492.0" y1="461" x2="1730.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="1764.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1889.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">3.2 Ouvir respostas e</text>
<text x="1889.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">perguntas</text>
<line x1="1770.0" y1="461" x2="2008.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="2042.0" y="390" width="250" height="44" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="2167.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">3.3 Verificar o chat</text>
<line x1="2048.0" y1="441" x2="2286.0" y2="441" stroke="#000" stroke-width="2.5"/>
<rect x="2320.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="2445.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">3.4 Chamar alguém pelo nome</text>
<text x="2445.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">quando ninguém responde</text>
<line x1="2326.0" y1="461" x2="2564.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="2864.0" y="200" width="330" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="3029.0" y="227" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">4. Interpretar os sinais obtidos</text>
<text x="3029.0" y="247" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3b8f">Plano 4: 4.1 &gt; 4.2 &gt; 4.3</text>
<rect x="2626.0" y="390" width="250" height="84" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="2751.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">4.1 Identificar quem reagiu</text>
<text x="2751.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">e qual é o papel dessa</text>
<text x="2751.0" y="457" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">pessoa</text>
<line x1="2632.0" y1="481" x2="2870.0" y2="481" stroke="#000" stroke-width="2.5"/>
<rect x="2904.0" y="390" width="250" height="84" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="3029.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">4.2 Comparar os sinais com o</text>
<text x="3029.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">que se espera de um cliente</text>
<text x="3029.0" y="457" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">que entendeu</text>
<line x1="2910.0" y1="481" x2="3148.0" y2="481" stroke="#000" stroke-width="2.5"/>
<rect x="3182.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="3307.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">4.3 Julgar o quanto confia</text>
<text x="3307.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">nessa leitura</text>
<line x1="3188.0" y1="461" x2="3426.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="3726.0" y="200" width="330" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="3891.0" y="227" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">5. Decidir como prosseguir</text>
<text x="3891.0" y="247" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3b8f">Plano 5: 5.1 / 5.2 / 5.3</text>
<rect x="3488.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="3613.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">5.1 Avançar para o próximo</text>
<text x="3613.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">bloco</text>
<line x1="3494.0" y1="461" x2="3732.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="3766.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="3891.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">5.2 Reforçar ou reexplicar o</text>
<text x="3891.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">ponto</text>
<line x1="3772.0" y1="461" x2="4010.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="4044.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="4169.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">5.3 Anotar o ponto para o</text>
<text x="4169.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">follow-up e avançar</text>
<line x1="4050.0" y1="461" x2="4288.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="4588.0" y="200" width="330" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="4753.0" y="227" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">6. Encerrar e registrar a reunião</text>
<text x="4753.0" y="247" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3b8f">Plano 6: 6.1 &gt; 6.2 &gt; 6.3</text>
<rect x="4350.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="4475.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">6.1 Combinar o próximo passo</text>
<text x="4475.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">com o cliente</text>
<line x1="4356.0" y1="461" x2="4594.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="4628.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="4753.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">6.2 Anotar percepções e</text>
<text x="4753.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">pontos de dúvida</text>
<line x1="4634.0" y1="461" x2="4872.0" y2="461" stroke="#000" stroke-width="2.5"/>
<rect x="4906.0" y="390" width="250" height="64" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="5031.0" y="417" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">6.3 Comparar as anotações</text>
<text x="5031.0" y="437" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#000">com o retorno do cliente</text>
<line x1="4912.0" y1="461" x2="5150.0" y2="461" stroke="#000" stroke-width="2.5"/>
