<text x="95" y="309" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">Ativar o</text>
<text x="95" y="326" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">acompanhamento</text>
