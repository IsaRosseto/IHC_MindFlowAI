<text x="465" y="309" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">Pausar ou retomar</text>
<text x="465" y="326" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">o acompanhamento</text>
