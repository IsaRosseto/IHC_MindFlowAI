<text x="1060" y="162" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">Decidir se reforça o conteúdo</text>
<text x="1060" y="179" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">fora do sistema: decisão da professora</text>
