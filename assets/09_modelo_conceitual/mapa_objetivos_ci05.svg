<text x="280" y="309" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">Perceber o estado</text>
<text x="280" y="326" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">da turma</text>
