<text x="185" y="459" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">Examinar uma</text>
<text x="185" y="476" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">mudança no estado</text>
