<text x="610" y="42" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">Conduzir a aula de inglês percebendo se a turma</text>
<text x="610" y="59" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">acompanha o conteúdo novo (P02 — Camila, CI05)</text>
