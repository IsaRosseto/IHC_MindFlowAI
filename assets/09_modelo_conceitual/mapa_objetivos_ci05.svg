<text x="185" y="599" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">Marcar o momento</text>
<text x="185" y="616" font-size="12.5" font-weight="normal" fill="#111827" text-anchor="middle">para revisar depois</text>
